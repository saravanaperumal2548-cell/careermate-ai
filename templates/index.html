<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CareerMate AI</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
 min-height:100vh;font-family:Arial,sans-serif;
 background:linear-gradient(135deg,#eef2ff,#f8fafc);
 display:flex;align-items:center;justify-content:center;padding:20px
}
.chat-app{
 width:100%;max-width:850px;height:88vh;min-height:560px;
 background:#fff;border-radius:24px;box-shadow:0 20px 60px rgba(15,23,42,.15);
 display:flex;flex-direction:column;overflow:hidden
}
.header{padding:22px 26px;background:#111827;color:#fff}
.header h1{font-size:24px;margin-bottom:6px}
.header p{font-size:13px;color:#cbd5e1}
.status{display:inline-flex;align-items:center;gap:7px;margin-top:12px;font-size:12px}
.dot{width:8px;height:8px;border-radius:50%;background:#22c55e}
#messages{flex:1;overflow-y:auto;padding:25px;display:flex;flex-direction:column;gap:15px}
.message{
 max-width:78%;padding:13px 16px;border-radius:17px;line-height:1.5;
 font-size:14px;white-space:pre-wrap;word-wrap:break-word
}
.bot{align-self:flex-start;background:#f1f5f9;color:#0f172a;border-bottom-left-radius:5px}
.user{align-self:flex-end;background:#111827;color:#fff;border-bottom-right-radius:5px}
.composer{padding:17px;border-top:1px solid #e5e7eb;display:flex;gap:10px}
#input{
 flex:1;border:1px solid #d1d5db;border-radius:14px;padding:13px 15px;
 font-size:14px;outline:none
}
#input:focus{border-color:#64748b}
button{
 border:0;border-radius:14px;padding:0 22px;background:#111827;color:#fff;
 font-weight:600;cursor:pointer
}
button:disabled{opacity:.55;cursor:not-allowed}
.typing{opacity:.65;font-style:italic}
@media(max-width:600px){
 .chat-app{height:94vh}.message{max-width:88%}.composer{padding:12px}
 button{padding:0 16px}
}
</style>
</head>
<body>
<main class="chat-app">
<header class="header">
<h1>CareerMate AI</h1>
<p>AI assistant for careers, jobs, resumes, interviews, and professional development</p>
<div class="status"><span class="dot"></span> Gemini AI Online</div>
</header>

<section id="messages">
<div class="message bot">
Hi! I'm CareerMate AI. Ask me anything related to careers, jobs, resumes, interviews, and professional development.
</div>
</section>

<form class="composer" id="chatForm">
<input id="input" autocomplete="off" placeholder="Type your question...">
<button id="sendBtn" type="submit">Send</button>
</form>
</main>

<script>
const form=document.getElementById("chatForm");
const input=document.getElementById("input");
const messages=document.getElementById("messages");
const sendBtn=document.getElementById("sendBtn");

function addMessage(text,type){
 const div=document.createElement("div");
 div.className="message "+type;
 div.textContent=text;
 messages.appendChild(div);
 messages.scrollTop=messages.scrollHeight;
 return div;
}

form.addEventListener("submit",async(e)=>{
 e.preventDefault();
 const message=input.value.trim();
 if(!message)return;

 addMessage(message,"user");
 input.value="";
 sendBtn.disabled=true;
 const typing=addMessage("Thinking...","bot typing");

 try{
   const response=await fetch("/chat",{
     method:"POST",
     headers:{"Content-Type":"application/json"},
     body:JSON.stringify({message})
   });
   const data=await response.json();
   typing.remove();

   if(response.ok) addMessage(data.reply||"No response received.","bot");
   else addMessage(data.error||"Something went wrong.","bot");
 }catch(error){
   typing.remove();
   addMessage("Could not connect to the server.","bot");
 }finally{
   sendBtn.disabled=false;
   input.focus();
 }
});
</script>
</body>
</html>
